packages:
  - "docs"

allowBuilds:
  bun: true
  es5-ext: true
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

minimumReleaseAgeExclude:
  - nhb-scripts
  - typescript
  - tsdown
  - "@types/*"

minimumReleaseAge: 120

peerDependencyRules:
  allowedVersions:
    typescript: "7"
