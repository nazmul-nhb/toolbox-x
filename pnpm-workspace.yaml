packages:
    - "docs"

allowBuilds:
    bun: true
    es5-ext: true
    esbuild: true
    sharp: true

minimumReleaseAgeExclude:
    - nhb-scripts
    - typescript
    - tsdown
    - "@types/*"

minimumReleaseAge: 120

peerDependencyRules:
    allowedVersions:
        typescript: "7"

permissions:
    ai:
        skills: true
    tsdown:
        skills: true

skills:
    dirs:
        - .agents/skills
